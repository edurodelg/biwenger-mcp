# Biwenger World Cup 2026 Configuration
INTERFACE_MODE: "api"
API_KEY: "replace_with_a_long_random_key"
READ_ONLY_API_KEY: "replace_with_a_read_only_key_for_public_mygpt"
DATABASE_URL: "sqlite:///data/biwenger.db"
BIWENGER_COMPETITION_SLUG: "world-cup"
REQUIRE_WRITE_CONFIRMATION: true
DEFAULT_SQUAD_SIZE: 11
DEFAULT_USER_ID: "default_user"

# Captain & Ariete (striker) Limits
CAPTAIN_MAX_PRICE: 70000000
CAPTAIN_PRICE_INCREMENT_PER_PHASE: 15000000
ARIETE_MAX_PRICE: 90000000
ARIETE_PRICE_INCREMENT_PER_PHASE: 15000000

# Budget Limits
GROUP_BUDGET: 920000000
BUDGET_INCREMENT_PER_PHASE: 60000000

# Max players from same national team per phase
GROUP_MAX_PLAYERS_SAME_TEAM: 3
ROUND_OF_16_MAX_PLAYERS_SAME_TEAM: 3
QUARTER_FINAL_MAX_PLAYERS_SAME_TEAM: 4
SEMIFINAL_MAX_PLAYERS_SAME_TEAM: 5
FINAL_MAX_PLAYERS_SAME_TEAM: 6

# Transfers allowed per matchday/phase
GROUP_TRANSFERS: 3
ROUND_OF_16_TRANSFERS: 4
QUARTER_FINAL_TRANSFERS: 4
SEMIFINAL_TRANSFERS: 5
FINAL_TRANSFERS: 6

# League prizes example distribution (EUR)
PRIZES_EUR:
  "1": 30
  "2": 20
  "3": 10
  "4": -10
  "5": -20
  "6": -30
