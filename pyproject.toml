[project]
name = "biwenger-mcp"
version = "0.1.1"
description = "Fixed-price squad optimizer and API/MCP server for Biwenger World Cup 2026"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "pydantic-settings",
    "httpx",
    "fastmcp",
    "pulp>=2.7.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0"
]

[dependency-groups]
dev = [
    "pytest-asyncio>=0.24",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
