openapi: 3.1.0
info:
  title: Biwenger Mundial 2026 Actions API
  description: API privada de administración del optimizador Biwenger Mundial 2026.
    Requiere la clave API de administrador en X-API-Key y un user_id estable en cada
    ruta. user_id separa configuración, ratings y plantilla local, pero no autentica
    por sí solo. Las acciones de plantilla son simulaciones locales y requieren el
    confirmation_token devuelto por la API. No existe acceso a credenciales ni a la
    cuenta real de Biwenger.
  version: 0.2.0
paths:
  /api/users/{user_id}/status:
    get:
      summary: Status Route
      operationId: getStatus
      security:
      - APIKeyHeader: []
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          title: User Id
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$
          maxLength: 64
        description: Stable tenant identifier; this is not authentication.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/users/{user_id}/rules:
    get:
      summary: Rules
      description: Return configurable example rules for this private league, not
        official Biwenger rules.
      operationId: getRules
      security:
      - APIKeyHeader: []
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          title: User Id
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$
          maxLength: 64
        description: Stable tenant identifier; this is not authentication.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/users/{user_id}/settings:
    get:
      summary: Get Settings
      description: Retrieve the current active budget and starting lineup formation
        settings.
      operationId: getSettings
      security:
      - APIKeyHeader: []
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          title: User Id
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$
          maxLength: 64
        description: Stable tenant identifier; this is not authentication.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      summary: Update Settings
      description: Update settings (e.g. budget limit, starting lineup formation)
        dynamically.
      operationId: updateSettings
      security:
      - APIKeyHeader: []
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          title: User Id
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$
          maxLength: 64
        description: Stable tenant identifier; this is not authentication.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingsUpdateRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
