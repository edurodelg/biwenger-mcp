        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      summary: Sync Database Via Get
      description: Compatibility alias for clients that call sync via GET.
      operationId: syncPublicDataViaGet
      security:
      - APIKeyHeader: []
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          title: User Id
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$
          maxLength: 64
        description: Stable tenant identifier; this is not authentication.
      responses:
        '200':
          description: Successful Response
          content:
