      - name: round_name
        in: query
        required: false
        schema:
          description: Filter by round name, e.g. 'Fase de Grupos, ronda 1'
          title: Round Name
          type: string
        description: Filter by round name, e.g. 'Fase de Grupos, ronda 1'
        style: form
        explode: true
      - name: status
        in: query
        required: false
        schema:
          description: 'Filter by status: pending, preview, finished'
