  /api/users/{user_id}/players:
    get:
      summary: Get Players
      description: Fetch players with optional query filters, sorting, and pagination.
      operationId: listPlayers
      security:
      - APIKeyHeader: []
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          title: User Id
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$
          maxLength: 64
        description: Stable tenant identifier; this is not authentication.
      - name: position
        in: query
        required: false
        schema:
          description: 'Filter by position: GK, DEF, MID, FWD'
          title: Position
          type: string
          enum:
          - GK
          - DEF
          - MID
          - FWD
        description: 'Filter by position: GK, DEF, MID, FWD'
        style: form
        explode: true
      - name: team
        in: query
        required: false
        schema:
          description: Filter by country/national team name
          title: Team
          type: string
        description: Filter by country/national team name
        style: form
        explode: true
      - name: status
        in: query
        required: false
        schema:
          description: 'Filter by availability status: ok, doubtful, injured'
          title: Status
          type: string
          enum:
          - ok
          - doubtful
          - injured
          - suspended
          - no_disponible
        description: 'Filter by availability status: ok, doubtful, injured'
        style: form
        explode: true
      - name: sort_by
        in: query
        required: false
        schema:
          type: string
          description: 'Sort by: fixed_price, points, market_value, goals, assists'
          default: fixed_price
          title: Sort By
          enum:
          - fixed_price
          - points
          - market_value
          - goals
          - assists
          - name
          - team
        description: 'Sort by: fixed_price, points, market_value, goals, assists'
        style: form
        explode: true
      - name: active_only
        in: query
        required: false
        schema:
          type: boolean
          description: Filter to show only players whose national teams are still
            active in the tournament
          default: true
          title: Active Only
        description: Filter to show only players whose national teams are still active
          in the tournament
        style: form
        explode: true
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          minimum: 1
          default: 100
          title: Limit
        style: form
        explode: true
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
        style: form
        explode: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
